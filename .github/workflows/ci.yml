name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Tool-backed tests skip themselves when their tool is absent, so CI
      # installs them to keep those paths actually covered: `dot` for the
      # Graphviz diagram tests, `xmllint` for the docx package's XML
      # well-formedness check, and LibreOffice plus `pdftotext` for the
      # `#[ignore]`d round-trip that opens the document for real.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libxml2-utils libreoffice-writer poppler-utils

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      # The round-trip is `#[ignore]`d so a laptop without LibreOffice still
      # has a fast `cargo test`. It is the only check that the document
      # actually opens, so CI must ask for it explicitly — and asking means
      # run it or fail, not skip.
      - name: Round-trip through LibreOffice
        run: cargo test --all-features -- --ignored
